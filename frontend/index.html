<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ambo University Attendance - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="card">
    <img src="../image/logo.jpg" alt="Ambo University" class="crest">
    <h1>Ambo University</h1>
    <p class="subtitle">Staff Attendance System</p>

  <div class="role-toggle">
    <button type="button" class="toggle-btn active" data-role="employee">Employee</button>
    <button type="button" class="toggle-btn" data-role="department_head">Dept. Head</button>
    <button type="button" class="toggle-btn" data-role="admin">Admin</button>
  </div>

    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>
    <p id="errorMsg" class="error"></p>
  </div>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
