<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Department Attendance - Ambo Attendance</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="dashboard">

  <div class="mobile-topbar">
    <button id="hamburgerBtn" class="hamburger" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <img src="../image/logo.jpg" alt="Ambo University" class="mobile-logo">
  </div>

  <aside class="sidebar">
    <div class="brand">
      <img src="../image/logo.jpg" alt="Ambo University">
      <span>Ambo University<br>Admin</span>
    </div>
    <nav>
      <a href="admin.html">Employees</a>
      <a href="admin-department.html" class="active">Department Attendance</a>
      <a href="admin-reports.html">Monthly Reports</a>
      <a href="admin-leave.html">Leave Requests</a>
      <a href="admin-register.html">Register Employee</a>
    </nav>
    <div class="user-box">
      <div class="name" id="userName"></div>
      <button id="logoutBtn" class="logout">Log Out</button>
    </div>
  </aside>

  <main class="main">
    <h1 class="page-title">Department Attendance</h1>

    <div class="section">
      <label for="departmentSelect">Select department</label>
      <select id="departmentSelect"></select>
    </div>

    <div class="section">
      <table>
        <thead>
          <tr><th>Employee</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Status</th></tr>
        </thead>
        <tbody id="deptAttendanceTable"></tbody>
      </table>
    </div>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/admin-department.js"></script>
</body>
</html>
